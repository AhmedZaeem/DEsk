# Red Ronin OS -- fuzzel, the quick launcher over the desk (Super+A) and the
# key bind sheet (Super+/). Copy to ~/.config/fuzzel/fuzzel.ini.
#
# Washi paper, sumi ink and a vermilion seal for what is chosen: the same
# paper the desk's sheets are, so it reads as a slip laid over them.
[main]
font=Noto Serif:size=13,Noto Serif CJK JP:size=13
prompt="浪  "
icon-theme=DEsk
icons-enabled=yes
width=44
lines=12
horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=24
letter-spacing=0.2
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
# washi (palette bone #E9E5DF), sumi ink, vermilion seal (#D40D1C)
background=f3efe6f5
text=1e1914ff
prompt=c4161cff
placeholder=8a8075ff
input=1e1914ff
match=c4161cff
selection=c4161cff
selection-text=f3efe6ff
selection-match=fff4e0ff
counter=8a8075ff
border=5a1a14ff

[border]
width=2
radius=6
