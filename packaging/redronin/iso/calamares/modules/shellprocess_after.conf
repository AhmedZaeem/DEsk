---
# and the live user, its passwordless sudo and its autologin, and the
# installer's launcher
dontChroot: false
timeout: 300
script:
  - "-userdel -r ronin"
  - "-rm -f /etc/sudoers.d/10-redronin-live"
  - "-rm -f /etc/sddm.conf.d/20-redronin-live.conf"
  - "-rm -f /etc/systemd/system/redronin-live.service /etc/systemd/system/multi-user.target.wants/redronin-live.service"
  - "-rm -f /usr/share/applications/redronin-install.desktop /usr/local/bin/redronin-install"
  - "-rm -rf /etc/systemd/system/getty@tty1.service.d"
  - "-rm -f /root/.automated_script.sh /root/.zlogin"
  - "-pacman -Rns --noconfirm calamares"
