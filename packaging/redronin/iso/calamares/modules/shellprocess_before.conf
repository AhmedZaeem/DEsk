---
# the live ISO's own pieces out of the installed system, before its
# initramfs is made: archiso's initramfs settings and preset, and the
# kernel into /boot (archiso keeps its own outside the squashfs; the linux
# package keeps a copy in /usr/lib/modules)
dontChroot: false
timeout: 300
script:
  - "sh -c 'cp /usr/lib/modules/*/vmlinuz /boot/vmlinuz-linux'"
  - "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
  - "-rm -f /etc/mkinitcpio.d/linux.preset"
  - "-sh -c 'printf \"ALL_kver=\\\"/boot/vmlinuz-linux\\\"\\nPRESETS=(default fallback)\\ndefault_image=\\\"/boot/initramfs-linux.img\\\"\\nfallback_image=\\\"/boot/initramfs-linux-fallback.img\\\"\\nfallback_options=\\\"-S autodetect\\\"\\n\" > /etc/mkinitcpio.d/linux.preset'"
