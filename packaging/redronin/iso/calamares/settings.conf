# Calamares for the Red Ronin live ISO: the live system, copied to the disk
# and made into an installed one.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: before
    module: shellprocess
    config: shellprocess_before.conf
  - id: after
    module: shellprocess
    config: shellprocess_after.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - shellprocess@before
      - luksbootkeyfile
      - initcpiocfg
      - initcpio
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - shellprocess@after
      - bootloader
      - umount
  - show:
      - finished

branding: redronin
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
