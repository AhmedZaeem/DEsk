# Red Ronin OS -- DEsk, as the Red Ronin workstation has it.
#
# Install: copy to ~/.config/desk/shell.conf (or add these lines to the one
# you have). Shell Settings keeps every line here when it writes its own.
# docs/TILING.md says what each key and action does.

# The desk: black urushi worn through to vermilion -- the palette's
# ink-black (sumi #0A0A0D) and crimson (#D40D1C) as a real material -- and
# over all of it a shitajiki, the indigo felt a calligrapher lays the paper
# on, its guide lines printed. The sheets lie on it as washi.
desk_wood = negoro
desk_stain = natural
desk_mat = shitajiki
desk_mat_size = full

# The sheets are washi, their headings ruled with one stroke of sumi; the one
# with the keys carries a vermilion seal (浪, the ro of ronin) and its stroke
# is in the seal's vermilion. The clock shows the stack you are on in ledger
# numerals (壱 弐 参 ...), and a stack with nothing open shows a sheet of
# practice paper with an enso brushed on it, the stack's numeral inside.
ui_style = redronin

# Sheets laid out side by side, as the Hyprland session does it.
tiling = yes
tiling_layout = master
tiling_ratio = 0.55
# (the palette's gap_in, in points)
tiling_gap = 6
workspaces_wrap = yes

# The Red Ronin keys, as ronin-binds.lua has them in Hyprland: Super+HJKL
# focus, Super+Shift+HJKL move, Super+-/= wider and narrower (Shift: taller
# and shorter), Super+V turns the split, Super+D the launcher, Super+1..0
# stacks, Super+Shift+1..0 send there, Super+Shift+V float, Super+W tiling
# on and off ... about ninety. The lines below take precedence over them.
bind_defaults = redronin

# The Ronin programs, on the Ronin keys
bind = SUPER+T exec kitty
bind = SUPER+SHIFT+Return exec kitty --class kitty-float
bind = SUPER+E exec dolphin
bind = SUPER+B exec chromium
bind = SUPER+ALT+A exec android-studio
bind = SUPER+M exec kitty -e btop
bind = SUPER+SHIFT+M fold
# bind = SUPER+R exec ronin-studio     (an example: a program of your own on a key)

# The launcher -- Super+D, as in Hyprland, or a tap of Super on its own --
# is fuzzel, themed by fuzzel.ini beside this file; Super+/ is every key in
# force, in the same slip. The bookcase (Super+A) stays the desk's own way
# to every program.
launcher = fuzzel --config "$HOME/.config/desk/fuzzel.ini"
super_tap = launcher
bind = SUPER+slash exec sh -c 'desk-ctl binds | fuzzel --config "$HOME/.config/desk/fuzzel.ini" --dmenu --prompt "keys  " --width 70 --font "JetBrainsMono Nerd Font:size=11,monospace:size=11" >/dev/null'

# going between stacks: scroll (emakimono), katana, byobu, shoji, cycle or none
ws_switch = scroll

# the night over the desk and the storm outside the window behind it:
# lightning now and then (storm = on | off), how dark (desk_night 0..100),
# and the rain heard through the window when its cord is pulled (rain_volume 0..100)
storm = on
desk_night = 60
rain_volume = 60

# the keys go to the window under the pointer, no click (no | yes | raise)
focus_follows_mouse = yes
